<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="500" height="320" fill="none">
  <defs>
    <linearGradient id="bizBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <linearGradient id="growthLine" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
  </defs>
  <rect width="500" height="320" rx="16" fill="url(#bizBg)"/>

  <!-- Growth Trajectory Chart with Non-Dilutive Capital Nodes -->
  <g transform="translate(60, 40)">
    <!-- Grid lines -->
    <line x1="20" y1="220" x2="380" y2="220" stroke="#CBD5E1" stroke-width="1.5"/>
    <line x1="20" y1="160" x2="380" y2="160" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="20" y1="100" x2="380" y2="100" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="20" y1="40" x2="380" y2="40" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4 4"/>

    <!-- Trajectory Curved Area -->
    <path d="M20 200 C100 190, 160 140, 240 110 C300 85, 330 55, 380 30" stroke="url(#growthLine)" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Milestone Callout 1: Innovation Grant -->
    <g transform="translate(100, 140)">
      <circle cx="0" cy="0" r="7" fill="#D97706" stroke="#FFFFFF" stroke-width="2"/>
      <rect x="-45" y="-35" width="90" height="24" rx="6" fill="#FFFFFF" stroke="#E2E8F0" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.06))"/>
      <text x="0" y="-20" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="9" font-weight="700" fill="#0F172A">INNOVATION</text>
    </g>

    <!-- Milestone Callout 2: Equipment Funding -->
    <g transform="translate(230, 95)">
      <circle cx="0" cy="0" r="7" fill="#2563EB" stroke="#FFFFFF" stroke-width="2"/>
      <rect x="-45" y="-35" width="90" height="24" rx="6" fill="#FFFFFF" stroke="#E2E8F0" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.06))"/>
      <text x="0" y="-20" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="9" font-weight="700" fill="#0F172A">EQUIPMENT</text>
    </g>

    <!-- Milestone Callout 3: Expansion & Workforce -->
    <g transform="translate(350, 45)">
      <circle cx="0" cy="0" r="8" fill="#10B981" stroke="#FFFFFF" stroke-width="2"/>
      <rect x="-50" y="-35" width="100" height="24" rx="6" fill="#0A192F"/>
      <text x="0" y="-20" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="9" font-weight="700" fill="#FFFFFF">NON-DILUTIVE</text>
    </g>
  </g>

  <text x="250" y="280" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#334155">EXPANSION WITHOUT EQUITY DILUTION</text>
</svg>
