<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A192F" />
      <stop offset="100%" stop-color="#0F274A" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="450" rx="20" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
  
  <!-- Subtle Grid Pattern -->
  <g opacity="0.1" stroke="#FFFFFF" stroke-width="1">
    <line x1="60" y1="0" x2="60" y2="450"/>
    <line x1="180" y1="0" x2="180" y2="450"/>
    <line x1="300" y1="0" x2="300" y2="450"/>
    <line x1="420" y1="0" x2="420" y2="450"/>
    <line x1="540" y1="0" x2="540" y2="450"/>
    <line x1="0" y1="90" x2="600" y2="90"/>
    <line x1="0" y1="180" x2="600" y2="180"/>
    <line x1="0" y1="270" x2="600" y2="270"/>
    <line x1="0" y1="360" x2="600" y2="360"/>
  </g>

  <!-- Network Interconnections / Strategic Funding Pathways -->
  <g stroke="#3B82F6" stroke-width="2" stroke-dasharray="4 4" opacity="0.4">
    <line x1="120" y1="120" x2="280" y2="100"/>
    <line x1="280" y1="100" x2="460" y2="140"/>
    <line x1="120" y1="120" x2="220" y2="240"/>
    <line x1="220" y1="240" x2="380" y2="230"/>
    <line x1="380" y1="230" x2="460" y2="140"/>
    <line x1="220" y1="240" x2="180" y2="350"/>
    <line x1="380" y1="230" x2="440" y2="340"/>
    <line x1="180" y1="350" x2="440" y2="340"/>
  </g>

  <!-- Active Pathway Solid Lines -->
  <g stroke="url(#blueGrad)" stroke-width="3">
    <line x1="120" y1="120" x2="280" y2="100"/>
    <line x1="280" y1="100" x2="380" y2="230"/>
    <line x1="380" y1="230" x2="440" y2="340"/>
  </g>

  <!-- Central Hub Card -->
  <g transform="translate(180, 180)">
    <rect width="240" height="90" rx="14" fill="#0F172A" stroke="rgba(59, 130, 246, 0.4)" stroke-width="1.5" filter="url(#glow)"/>
    <circle cx="35" cy="45" r="18" fill="url(#blueGrad)"/>
    <path d="M30 45L34 49L41 41" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="65" y="40" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">STRATEGIC PIPELINE</text>
    <text x="65" y="58" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11">Aligned Opportunity Architecture</text>
  </g>

  <!-- Node 1: Discovery / Research -->
  <g transform="translate(70, 80)">
    <circle cx="45" cy="45" r="32" fill="#0A192F" stroke="#3B82F6" stroke-width="2"/>
    <circle cx="45" cy="45" r="14" fill="#1E3A8A"/>
    <text x="45" y="100" text-anchor="middle" fill="#E2E8F0" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">Opportunity Scan</text>
  </g>

  <!-- Node 2: Alignment & Eligibility -->
  <g transform="translate(240, 55)">
    <circle cx="40" cy="40" r="26" fill="#0A192F" stroke="#D97706" stroke-width="2"/>
    <circle cx="40" cy="40" r="10" fill="url(#goldGrad)"/>
    <text x="40" y="86" text-anchor="middle" fill="#E2E8F0" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">Eligibility Filter</text>
  </g>

  <!-- Node 3: Narrative & Proposal -->
  <g transform="translate(420, 95)">
    <circle cx="40" cy="40" r="28" fill="#0A192F" stroke="#3B82F6" stroke-width="2"/>
    <circle cx="40" cy="40" r="12" fill="#2563EB"/>
    <text x="40" y="90" text-anchor="middle" fill="#E2E8F0" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">Compelling Case</text>
  </g>

  <!-- Node 4: Review & Post-Award -->
  <g transform="translate(400, 290)">
    <circle cx="40" cy="40" r="30" fill="#0A192F" stroke="#10B981" stroke-width="2"/>
    <circle cx="40" cy="40" r="12" fill="#059669"/>
    <text x="40" y="92" text-anchor="middle" fill="#E2E8F0" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">Award & Reporting</text>
  </g>

  <!-- Node 5: Diversified Expansion -->
  <g transform="translate(130, 305)">
    <circle cx="40" cy="40" r="26" fill="#0A192F" stroke="#818CF8" stroke-width="2"/>
    <circle cx="40" cy="40" r="10" fill="#4F46E5"/>
    <text x="40" y="86" text-anchor="middle" fill="#E2E8F0" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">Pipeline Renewal</text>
  </g>
</svg>
