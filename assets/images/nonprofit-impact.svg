<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="500" height="320" fill="none">
  <defs>
    <linearGradient id="npBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#DBEAFE"/>
    </linearGradient>
  </defs>
  <rect width="500" height="320" rx="16" fill="url(#npBg)"/>
  
  <!-- Foundation Pillars Graphic -->
  <g transform="translate(60, 60)">
    <!-- Column 1: Community Foundation -->
    <rect x="20" y="40" width="80" height="140" rx="8" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="35" y="60" width="50" height="8" rx="4" fill="#2563EB"/>
    <rect x="35" y="80" width="35" height="6" rx="3" fill="#94A3B8"/>
    <rect x="35" y="95" width="40" height="6" rx="3" fill="#94A3B8"/>
    <rect x="35" y="140" width="50" height="22" rx="4" fill="#EFF6FF"/>
    <text x="60" y="155" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="9" font-weight="700" fill="#1D4ED8">FOUNDATION</text>

    <!-- Column 2: Government Programs -->
    <rect x="140" y="20" width="90" height="160" rx="8" fill="#0A192F" stroke="#1E40AF" stroke-width="1.5"/>
    <circle cx="185" cy="50" r="16" fill="#1E3A8A"/>
    <path d="M185 42L189 48H181L185 42Z" fill="#60A5FA"/>
    <rect x="155" y="80" width="60" height="8" rx="4" fill="#FFFFFF"/>
    <rect x="155" y="98" width="45" height="6" rx="3" fill="#94A3B8"/>
    <rect x="155" y="112" width="50" height="6" rx="3" fill="#94A3B8"/>
    <rect x="150" y="145" width="70" height="24" rx="4" fill="#2563EB"/>
    <text x="185" y="161" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="9" font-weight="700" fill="#FFFFFF">GOVERNMENT</text>

    <!-- Column 3: Corporate & Operating -->
    <rect x="270" y="55" width="80" height="125" rx="8" fill="#FFFFFF" stroke="#FDE68A" stroke-width="1.5"/>
    <rect x="285" y="75" width="50" height="8" rx="4" fill="#D97706"/>
    <rect x="285" y="95" width="40" height="6" rx="3" fill="#94A3B8"/>
    <rect x="285" y="110" width="30" height="6" rx="3" fill="#94A3B8"/>
    <rect x="285" y="140" width="50" height="22" rx="4" fill="#FEF3C7"/>
    <text x="310" y="155" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="9" font-weight="700" fill="#B45309">CORPORATE</text>
  </g>

  <!-- Impact Bridge Overlay -->
  <path d="M50 250C150 210 350 210 450 250" stroke="#2563EB" stroke-width="3" stroke-linecap="round"/>
  <circle cx="250" cy="225" r="20" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <path d="M243 225L248 230L258 220" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="250" y="275" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#0A192F">SUSTAINABLE MISSION CAPITAL</text>
</svg>
